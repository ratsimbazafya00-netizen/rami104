<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rami 104 — Table de jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="home">
  <main class="home-wrap">
    <div class="brand">
      <div class="brand-suits" aria-hidden="true">
        <span class="suit red">♥</span><span class="suit black">♠</span><span class="suit red">♦</span><span class="suit black">♣</span>
      </div>
      <h1>Rami<span class="dot">·</span>104</h1>
      <p class="tagline">Table à 5 joueurs. Tri, escalier, carré — et gare aux jokers.</p>
    </div>

    <section class="panel" id="panel-create">
      <h2>Ouvrir une table</h2>
      <label for="create-name">Votre nom</label>
      <input id="create-name" type="text" maxlength="20" placeholder="ex. Rasoa" autocomplete="off">
      <button id="btn-create" class="btn btn-primary">Créer le salon</button>
    </section>

    <div class="divider"><span>ou</span></div>

    <section class="panel" id="panel-join">
      <h2>Rejoindre une table</h2>
      <label for="join-code">Code du salon</label>
      <input id="join-code" type="text" maxlength="5" placeholder="ex. A1B2C" autocomplete="off" style="text-transform:uppercase">
      <label for="join-name">Votre nom</label>
      <input id="join-name" type="text" maxlength="20" placeholder="ex. Tiana" autocomplete="off">
      <button id="btn-join" class="btn btn-secondary">Rejoindre</button>
    </section>

    <p id="home-error" class="error-text" hidden></p>
  </main>

<script src="{{ url_for('static', filename='js/game.js') }}"></script>
<script>
  RamiHome.init();
</script>
</body>
</html>
